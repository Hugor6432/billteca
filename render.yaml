databases:
  - name: biblioteca-db
    plan: free
    databaseName: biblioteca_db
    user: biblioteca_user

services:
  - type: web
    name: biblioteca-django
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn biblioteca.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
